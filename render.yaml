services:
  - type: web
    name: aventura-rd-frontend
    env: python
    buildCommand: pip install reflex==0.6.7 click==8.1.7 typer==0.9.0 httpx pydantic==2.0.3 && reflex export --frontend-only
    startCommand: npx serve .web/dist -p $PORT
    envVars:
      - key: BACKEND_URL
        value: https://aventura-rd-api.onrender.com